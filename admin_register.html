<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Admin - Layanan Kesehatan</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>🏥 Daftar Admin</h1>
                <p>Buat akun admin baru</p>
            </div>

            <form id="adminRegisterForm" class="auth-form">
                <div class="form-group">
                    <label for="adminName">Nama Lengkap</label>
                    <input type="text" id="adminName" name="name" placeholder="Masukkan nama lengkap" required>
                </div>

                <div class="form-group">
                    <label for="adminEmail">Email</label>
                    <input type="email" id="adminEmail" name="email" placeholder="Masukkan email" required>
                </div>

                <div class="form-group">
                    <label for="adminPhone">Nomor Telepon</label>
                    <input type="tel" id="adminPhone" name="phone" placeholder="Masukkan nomor telepon" required>
                </div>

                <div class="form-group">
                    <label for="adminLicense">Nomor Lisensi Medis</label>
                    <input type="text" id="adminLicense" name="license" placeholder="Masukkan nomor lisensi" required>
                </div>

                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" name="password" placeholder="Masukkan password" required>
                </div>

                <div class="form-group">
                    <label for="adminConfirmPassword">Konfirmasi Password</label>
                    <input type="password" id="adminConfirmPassword" name="confirmPassword" placeholder="Konfirmasi password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Daftar</button>
            </form>

            <div class="auth-footer">
                <p>Sudah punya akun? <a href="admin_login.html">Login di sini</a></p>
                <p><a href="index.html">Kembali ke beranda</a></p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('adminRegisterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('adminName').value;
            const email = document.getElementById('adminEmail').value;
            const phone = document.getElementById('adminPhone').value;
            const license = document.getElementById('adminLicense').value;
            const password = document.getElementById('adminPassword').value;
            const confirmPassword = document.getElementById('adminConfirmPassword').value;

            if (password !== confirmPassword) {
                alert('Password tidak sama!');
                return;
            }

            registerUser('admin', {
                name: name,
                email: email,
                phone: phone,
                license: license,
                password: password
            });
        });
    </script>
</body>
</html>
