<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar User - Layanan Kesehatan</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>🏥 Daftar Pengguna</h1>
                <p>Buat akun baru Anda</p>
            </div>

            <form id="userRegisterForm" class="auth-form">
                <div class="form-group">
                    <label for="userName">Nama Lengkap</label>
                    <input type="text" id="userName" name="name" placeholder="Masukkan nama lengkap" required>
                </div>

                <div class="form-group">
                    <label for="userEmail">Email</label>
                    <input type="email" id="userEmail" name="email" placeholder="Masukkan email" required>
                </div>

                <div class="form-group">
                    <label for="userPhone">Nomor Telepon</label>
                    <input type="tel" id="userPhone" name="phone" placeholder="Masukkan nomor telepon" required>
                </div>

                <div class="form-group">
                    <label for="userAge">Usia</label>
                    <input type="number" id="userAge" name="age" placeholder="Masukkan usia" min="1" max="120" required>
                </div>

                <div class="form-group">
                    <label for="userAddress">Alamat</label>
                    <textarea id="userAddress" name="address" placeholder="Masukkan alamat lengkap" rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label for="userPassword">Password</label>
                    <input type="password" id="userPassword" name="password" placeholder="Masukkan password" required>
                </div>

                <div class="form-group">
                    <label for="userConfirmPassword">Konfirmasi Password</label>
                    <input type="password" id="userConfirmPassword" name="confirmPassword" placeholder="Konfirmasi password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Daftar</button>
            </form>

            <div class="auth-footer">
                <p>Sudah punya akun? <a href="user_login.html">Login di sini</a></p>
                <p><a href="index.html">Kembali ke beranda</a></p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('userRegisterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('userName').value;
            const email = document.getElementById('userEmail').value;
            const phone = document.getElementById('userPhone').value;
            const age = document.getElementById('userAge').value;
            const address = document.getElementById('userAddress').value;
            const password = document.getElementById('userPassword').value;
            const confirmPassword = document.getElementById('userConfirmPassword').value;

            if (password !== confirmPassword) {
                alert('Password tidak sama!');
                return;
            }

            registerUser('user', {
                name: name,
                email: email,
                phone: phone,
                age: age,
                address: address,
                password: password
            });
        });
    </script>
</body>
</html>
